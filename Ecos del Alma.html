<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<title>Ecos del Alma - Acceso de Administrador</title>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-slate-100">
<div class="relative flex h-screen w-full flex-col overflow-hidden">
<!-- Background Watermark/Pattern -->
<div class="absolute inset-0 z-0 opacity-5 pointer-events-none flex items-center justify-center">
<svg class="w-[600px] h-[600px] text-primary" fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z"></path>
</svg>
</div>
<!-- Main Content Container -->
<div class="layout-container flex h-full grow flex-col z-10">
<header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-primary/20 px-6 md:px-10 py-4 backdrop-blur-sm bg-background-dark/50">
<div class="flex items-center gap-4 text-primary">
<div class="size-6">
<svg fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M44 4H30.6666V17.3334H17.3334V30.6666H4V44H44V4Z" fill="currentColor"></path>
</svg>
</div>
<h2 class="text-slate-100 text-xl font-bold leading-tight tracking-tight uppercase">Ecos del Alma</h2>
</div>
<div class="text-primary/60">
<span class="material-symbols-outlined text-2xl">verified_user</span>
</div>
</header>
<main class="flex flex-1 flex-col items-center justify-center px-4">
<div class="w-full max-w-lg space-y-8 bg-background-dark/80 p-8 rounded-xl border border-primary/10 shadow-2xl backdrop-blur-md">
<div class="text-center space-y-3">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary/10 border border-primary/30 mb-4">
<span class="material-symbols-outlined text-primary text-3xl">lock_person</span>
</div>
<h1 class="text-slate-100 text-3xl font-black leading-tight tracking-tight">Acceso de Administrador</h1>
<p class="text-slate-400 text-base font-normal">Ingresa el código maestro para continuar</p>
</div>
<div class="space-y-6">
<div class="flex justify-center py-2">
<!-- Single Multi-Digit Input Field Container -->
<div class="w-full flex flex-col items-center gap-2">
<input autocomplete="off" class="w-full h-16 bg-transparent border-0 border-b-2 border-primary/30 focus:border-primary focus:ring-0 text-xl md:text-2xl font-bold text-primary text-center transition-all placeholder:text-primary/20 uppercase tracking-widest" placeholder="••••••••••••" type="text"/>
<p class="text-[10px] text-primary/40 uppercase tracking-tighter italic">Código Maestro Requerido</p>
</div>
</div>
<div class="flex flex-col gap-4">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-14 px-6 bg-primary hover:bg-primary/90 text-white text-base font-bold leading-normal tracking-wide transition-all shadow-lg shadow-primary/20 group">
<span class="truncate uppercase mr-2">Verificar Credenciales</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1">key</span>
</button>
<div class="flex items-center justify-between px-1">
<a class="text-xs text-primary/60 hover:text-primary transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-sm">help_outline</span>
                                Ayuda con mi código
                            </a>
<a class="text-xs text-primary/60 hover:text-primary transition-colors" href="#">Volver al sitio</a>
</div>
</div>
</div>
<!-- Subtle Decorative Element -->
<div class="pt-8 border-t border-primary/10 flex flex-col items-center gap-2">
<div class="h-0.5 w-12 bg-primary/20 rounded-full"></div>
<span class="text-[10px] text-primary/30 uppercase tracking-[0.3em]">Cámara de Custodia de Manuscritos</span>
</div>
</div>
</main>
<footer class="p-6 text-center">
<p class="text-primary/40 text-xs font-medium tracking-wider">
                © 2024 ECOS DEL ALMA. ARCHIVO RESTRINGIDO.
            </p>
</footer>
</div>
</div>
<style>
    /* Custom styles for focus transitions and hiding spin buttons */
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    input[type=number] {
        -moz-appearance: textfield;
    }
    
    /* Background enhancement */
    body {
        background: radial-gradient(circle at center, #2d1d15 0%, #221610 100%);
    }
</style>
</body></html>
