<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "background-dark": "#1a110c",
                    },
                    fontFamily: { "display": ["Public Sans"] },
                },
            },
        }
    </script>
    <style> body { font-family: 'Public Sans', sans-serif; } </style>
    <title>Ecos del Alma - Cámara de Custodia</title>
</head>
<body class="bg-background-dark text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-black/40 p-10 rounded-[40px] border border-white/5 backdrop-blur-xl shadow-2xl">
        <div class="flex flex-col items-center text-center space-y-6">
            <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center text-primary border border-primary/20">
                <span class="material-symbols-outlined text-4xl">shield_lock</span>
            </div>
            
            <div class="space-y-2">
                <h1 class="text-3xl font-black uppercase tracking-tighter italic">Cámara de <span class="text-primary text-4xl">Custodia</span></h1>
                <p class="text-slate-500 text-sm font-medium italic">Solo los guardianes de la palabra pueden cruzar este umbral.</p>
            </div>

            <div class="w-full space-y-4 pt-4">
                <div class="relative group">
                    <input id="adminCode" type="password" placeholder="Código de Guardián" class="w-full bg-white/5 border-0 border-b-2 border-white/10 py-4 px-2 outline-none focus:border-primary transition-all text-center text-xl tracking-[0.5em] font-bold text-primary placeholder:text-slate-700 placeholder:tracking-normal placeholder:font-normal uppercase">
                </div>
                
                <button onclick="verificarCodigo()" class="w-full bg-primary text-white font-black py-5 rounded-3xl shadow-xl shadow-primary/20 hover:scale-[1.03] active:scale-95 transition-all uppercase tracking-widest text-sm">Verificar Identidad</button>
                
                <p id="errorMessage" class="text-red-500 text-xs font-bold uppercase tracking-widest hidden">Código Incorrecto - Acceso Denegado</p>
                
                <a href="index.html" class="block text-[10px] text-slate-600 uppercase tracking-widest hover:text-white transition-colors pt-4">← Regresar al Mundo Humano</a>
            </div>
        </div>
    </div>

    <script>
        function verificarCodigo() {
            const code = document.getElementById('adminCode').value.toUpperCase();
            const error = document.getElementById('errorMessage');
            
            // EL CÓDIGO MAESTRO
            if (code === "ECOS DEL ALMA 2026") {
                // REDIRECCIÓN CORREGIDA A MINÚSCULA
                window.location.href = "admin.html";
            } else {
                error.classList.remove('hidden');
                setTimeout(() => {
                    error.classList.add('hidden');
                }, 3000);
            }
        }
    </script>
</body>
</html>
